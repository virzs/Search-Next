name: Build release assets
run-name: Build release assets · ${{ github.ref_name }}

on:
  push:
    tags:
      - "v*"
      - "*-v*"

permissions:
  contents: write

env:
  RELEASE_BRANCH: release

jobs:
  build-assets:
    name: Build and upload release assets
    runs-on: ubuntu-latest
    steps:
      - name: Checkout release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0

      - name: Resolve release project
        id: release
        shell: bash
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          node scripts/resolve-release-tag.cjs "${RELEASE_TAG}" >> "$GITHUB_OUTPUT"

      - name: Validate release branch
        shell: bash
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          set -euo pipefail

          git fetch origin "${RELEASE_BRANCH}:refs/remotes/origin/${RELEASE_BRANCH}"
          tag_sha="$(git rev-list -n 1 "${RELEASE_TAG}")"

          if ! git merge-base --is-ancestor "${tag_sha}" "origin/${RELEASE_BRANCH}"; then
            echo "Release tag ${RELEASE_TAG} is not contained in origin/${RELEASE_BRANCH}." >&2
            echo "Merge the source branch into ${RELEASE_BRANCH}, then create the release from ${RELEASE_BRANCH}." >&2
            exit 1
          fi

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.23.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Setup Chrome for app screenshots
        id: setup-chrome
        uses: browser-actions/setup-chrome@v1

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Write optional frontend env files
        shell: bash
        env:
          WEB_PROD_ENV: ${{ secrets.WEB_PROD_ENV }}
        run: |
          set -euo pipefail

          if [[ -n "${WEB_PROD_ENV}" ]]; then
            printf '%s\n' "${WEB_PROD_ENV}" > apps/web/prod.env
          else
            touch apps/web/prod.env
          fi

      - name: Prepare release notes
        shell: bash
        env:
          RELEASE_PROJECT: ${{ steps.release.outputs.project }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          TAG_MATCH: ${{ steps.release.outputs.tag_match }}
        run: |
          set -euo pipefail

          tag_commit="$(git rev-list -n 1 "${RELEASE_TAG}")"
          previous_tag="$(git describe --tags --match "${TAG_MATCH}" --abbrev=0 "${tag_commit}^" 2>/dev/null || true)"
          args=(notes --project "${RELEASE_PROJECT}" --to "${RELEASE_TAG}")
          if [[ -n "${previous_tag}" ]]; then
            args+=(--from "${previous_tag}")
          fi

          node scripts/release-assets.mjs "${args[@]}" > "${RUNNER_TEMP}/release-notes.md"
          cat "${RUNNER_TEMP}/release-notes.md"

      - name: Build release assets
        env:
          APP_SCREENSHOT_CHROME: ${{ steps.setup-chrome.outputs.chrome-path }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: pnpm release:prepare -- --project "${{ steps.release.outputs.project }}" --version "${{ steps.release.outputs.version }}"

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          RELEASE_NAME: ${{ steps.release.outputs.release_name }}
        run: |
          set -euo pipefail

          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release edit "$RELEASE_TAG" --title "$RELEASE_NAME" --notes-file "${RUNNER_TEMP}/release-notes.md"
            gh release upload "$RELEASE_TAG" dist/releases/* --clobber
          else
            gh release create "$RELEASE_TAG" dist/releases/* --title "$RELEASE_NAME" --notes-file "${RUNNER_TEMP}/release-notes.md" --verify-tag
          fi
