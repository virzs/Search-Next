function moteObjs(t,objs){
  /* 主��粒子：飘壮/雪花/花瓣/萤火随风格换型，密度不变（64 颗） */
  const span=1300,pmod=(v,M)=>((v%M)+M)%M;
  const pw=[0,0,0,0];
  for(let s=0;s<5;s++){if(ambW[s]>0.001)pw[STYLES[s].ptype]+=ambW[s]}
  const cum=[pw[0],pw[0]+pw[1],pw[0]+pw[1]+pw[2],1];
  const moteN=110+Math.round(pw[1]*130);/* 雪境最多 240 颗，形成明显但轻的降雪 */
  for(let k=0;k<moteN;k++){
    const rk=hash(k,601);
    let ty=0;for(let s2=0;s2<4;s2++){if(rk<=cum[s2]+1e-6){ty=s2;break}}
    const wgt=Math.min(1,pw[ty]*2.5);if(wgt<=0.02)continue;

      py=(hash(k,507)-0.5)*1000+Math.sin(t*0.5+k)*40;
      pz=185-((t*(9+hash(k,509)*9)+hash(k,513)*185)%185);
      a=0.2+0.28*(Math.sin(t*1.4+k*2.1)*0.5+0.5);sz=1.05;
    }else if(ty===2){/* 花���：慢��+横摆 */
      col='235,176,186';
      px=Lx-span+pmod(hash(k,501)*span*2-Lx-t*(64+hash(k,503)*36),span*2)+Math.sin(t*1.1+k*1.3)*22;
      py=(hash(k,507)-0.5)*1000+Math.sin(t*0.7+k)*46;
      pz=180-((t*(5+hash(k,509)*5)+hash(k,513)*180)%180);
      a=0.2+0.26*(Math.sin(t*1.7+k*2.4)*0.5+0.5);sz=1.0;
    }else if(ty===3){/* 萤火���低空慢漂+呼吸脉冲 */
      col='222,236,150';
      px=Lx-span+pmod(hash(k,501)*span*2-Lx-t*(30+hash(k,503)*18),span*2);
      py=(hash(k,507)-0.5)*900+Math.sin(t*0.4+k)*30;
      pz=20+hash(k,509)*70+Math.sin(t*0.6+k*1.7)*8;
      const pu=Math.sin(t*(1.1+hash(k,517)*1.2)+k*2.6)*0.5+0.5;
      a=pu*pu*pu*0.85;sz=0.9;
    }else{/* 开场暖纸：小颗青灰尘粒，确保第一幕也能读到空气流动 */
      col='194,210,209';
      px=Lx-span+pmod(hash(k,501)*span*2-Lx-t*(88+hash(k,503)*56),span*2);
      py=(hash(k,507)-0.5)*1000+Math.sin(t*0.3+k)*34;
      pz=26+hash(k,509)*160+Math.sin(t*0.5+k*1.7)*9;
      a=0.22+0.28*(Math.sin(t*1.9+k*2.1)*0.5+0.5);sz=0.95;
    }
    const q=proj(px,py,pz);if(!q)continue;
    const al=a*wgt*(1-q.z/FAR);if(al<=0.01)continue;
    /* 近大远小：每颗带尺寸变化，��近镜头可飘过大颗粒子 */
    const rr=clamp(FLv/q.z*sz*(0.55+hash(k,521)*0.8),0.35,4.2);

  }
}

    ctx.fillStyle=fl;ctx.fill();if(stk&&sf>0.02){ctx.globalAlpha=fade*sf;ctx.strokeStyle=stk;ctx.lineWidth=lw;ctx.stroke();ctx.globalAlpha=fade}};

  if(!nose||!tail||!keL||!keR){ctx.globalAlpha=1;return}
  const so=clamp(FLv/zc*1.4*bd.sz,1,5.5),SH='rgba(110,122,126,0.16)';
  const off=q=>({x:q.x+so,y:q.y+so*1.25});

    const tx=x0+hash(i,j+11)*CELL,ty=y0+hash(i+11,j)*CELL;
    if(Math.abs(ty-riverC(tx))<RIVW+30)continue;

    else objs.push({k:'tree',o:{x:tx,y:ty,h:14+hash(i,j+13)*14,v:hash(i,j+15),si:siS,s0:smS[0],s1:smS[1],sm:smS[2]},z:zc});

    const bf=ss(Lx-1700,Lx-1250,b.x);if(bf<=0)continue;/* 身后渐隐，不再整排硬切 */

  cloudT=t;
  const c0=Math.floor((Lx+cloudT*82-1400)/185),c1=Math.floor((Lx+cloudT*82+FAR)/185);
  for(let m=c0;m<=c1;m++){
    const cd=cloudDef(m),q=proj(cd.cx,cd.cy,cd.cz);

    objs.push({k:'cloud',m,z:zc});

  for(let i=0;i<NB;i++){

    const zc=zcOf(st.px,st.py,st.pz);if(zc<NEAR)continue;
    /* 排序深度用队形槽位基准（去掉时间摆动项）：鸟与鸟的前后关系固定，

    const bd=birdD[i],svq=tilt*(1-yawN);

  for(const o of objs){
    let fade=(1-ss(FAR*0.62,FAR*0.98,o.z))*(o.bf===undefined?1:o.bf);
    if(o.k==='house'||o.k==='spire'||o.k==='tree'||o.k==='box')fade*=ss(NEAR-10,NEAR+70,o.z);/* 掠过镜头时渐隐而非突然消失 */
    if(fade<=0)continue;

    else if(o.k==='house')drawHouse(o.b,fade);
    else if(o.k==='spire')drawSpire(o.b,fade);
    else if(o.k==='box')drawBox(o.b,fade);
    else if(o.k==='cloud')drawCloud(o.m,fade*0.9);
    else if(o.k==='mote')drawMote(o.mo,fade);

  }

  },900+ci*130+10500);
}
function resetFlockAtStart(){const tt=performance.now()/1000;for(let i=0;i<NB;i++){const sl=slotOf(i,tt),st=birdS[i];st.px=sl.x;st.py=sl.y;st.pz=sl.z;st.vx=st.vy=st.vz=0;st.hd=0;st.init=true}}
let wallpaperVisible=!document.hidden,reducedMotion=false;
document.addEventListener('visibilitychange',()=>{wallpaperVisible=!document.hidden});
addEventListener('search-next-wallpaper-environment',event=>{
  const detail=event.detail||{};
  wallpaperVisible=detail.visible!==false;
  reducedMotion=detail.reducedMotion===true;
});
resetFlockAtStart();
setTimeout(showPoem,2600);
let last=performance.now();
function frame(now){
  const dt=wallpaperVisible&&!reducedMotion?Math.min(0.05,(now-last)/1000):0;last=now;
  const t=now/1000;
  if(started&&forceP===null)pT+=dt*curSp;
  const ln=Math.max(0,Math.floor(pT/CYCLE));
  if(ln!==loopN){loopN=ln;SCHED=buildSched(ln)}
  p=forceP!==null?forceP:(pT/CYCLE)%1;
  /* 固定弧线 + 每圈变奏：段��保持，段间连续滑移 */
  const stC=schedState(p);curSp=stC.sp;
  /* 滚轮观察偏移：停手 2s 后缓慢回归 */
  if(performance.now()-wheelT>2000){wheelD*=Math.exp(-dt*0.55);wheelH*=Math.exp(-dt*0.55)}
  wD+=(wheelD-wD)*Math.min(1,dt*4);wH+=(wheelH-wH)*Math.min(1,dt*4);
  let A=stC.A,B=stC.B;
  if(camMode==='free'){A=freeA;B=freeB}
  lastCamA=A;lastCamB=B;
  tilt=clamp((1.5551-A)/1.4501,0,1);
  yawN=clamp(Math.abs(B)/1.5708,0,1);
  dist=(camMode==='free'?freeDist:stC.dist)*(1+wD)*(H>W?1.26:1);/* 竖屏适当拉远保构图 */
  const sinA=Math.sin(A),cosA=Math.cos(A),sinB=Math.sin(B),cosB=Math.cos(B);
  f={x:sinB*cosA,y:cosB*cosA,z:-sinA};
  u={x:sinB*sinA,y:cosB*sinA,z:cosA};
  r={x:f.y*u.z-f.z*u.y,y:f.z*u.x-f.x*u.z,z:f.x*u.y-f.y*u.x};
  /* 转����速率→跟随重定位���速：镜头转多快，鸟就多不慌（防弹回） */
  glide+=((Math.abs(A-pA)+Math.abs(B-pB))/Math.max(dt,0.001)-glide)*Math.min(1,dt*3);pA=A;pB=B;
  const damp=1/(1+glide*9);
  const ke=Math.min(1,dt*2.0);
  rS.x+=(r.x-rS.x)*ke;rS.y+=(r.y-rS.y)*ke;rS.z+=(r.z-rS.z)*ke;
  uS.x+=(u.x-uS.x)*ke;uS.y+=(u.y-uS.y)*ke;uS.z+=(u.z-uS.z)*ke;
  const rn=Math.hypot(rS.x,rS.y,rS.z)||1,un=Math.hypot(uS.x,uS.y,uS.z)||1;
  rS.x/=rn;rS.y/=rn;rS.z/=rn;uS.x/=un;uS.y/=un;uS.z/=un;
  flockX+=dt*(52+(started?60*stC.sp:48*stC.sp)+60*tilt*(1-yawN));/* 开场只比正式巡航慢一点，不像静止展示 */
  /* 鼠标驾驶：把鼠标偏移投影到世界横向（y 轴）在屏��上��方向——俯视时上下引航，斜视/追尾时左右引航；
     越靠屏幕边缘漂越快，但封��不快，可��河引航 */
  const actS=(performance.now()-lastMove<1600)||pdown;
  const nsx=actS&&mx>=0?clamp((mx-W/2)/(W*0.5),-1,1):0;
  const nsy=actS&&my>=0?clamp((H/2-my)/(H*0.5),-1,1):0;
  const nsw=clamp(nsx*rS.y+nsy*uS.y,-1,1);
  steerVy=58*Math.pow(Math.abs(nsw),1.7)*Math.sign(nsw);
  steerY=clamp(steerY+steerVy*dt,-300,300);
  if(!actS)steerY+=(0-steerY)*Math.min(1,dt*0.05);/* 松手后极慢回中 */
  /* 镜头��更快、但仍带一点惯性的节奏追上鸟群偏航 */
  camSteerY+=(steerY-camSteerY)*Math.min(1,dt*4.8);
  window.__steer=()=>[steerY,camSteerY,cpx,cpy];
  const T={x:flockX,y:stC.ty+camSteerY,z:stC.tz+wH};
  cam={x:T.x-f.x*dist,y:T.y-f.y*dist,z:Math.max(15,T.z-f.z*dist)};
  /* 镜头随鼠标���慢偏一点 */
  const panFollow=camMode==='auto'&&actS;
  cpx+=((panFollow&&mx>=0?(mx-W/2)*0.30:0)-cpx)*Math.min(1,dt*0.95);
  cpy+=((panFollow&&my>=0?(my-H/2)*0.14:0)-cpy)*Math.min(1,dt*0.72);
  panX=stC.pan*W+cpx;panY=stC.pay*H+cpy;
  Lx=cam.x+f.x*dist;Ly=cam.y+f.y*dist;
  if(started&&poemOn)poemColor();
  /* 鼠标跟随向量���沿平滑相机轴，转场无感���交�� */
  const act=(performance.now()-lastMove<1600)||pdown;
  /* 风的强度包络：重新动起来约 0.8s 渐入，停下后缓缓渐出——不再从静止瞬间满力聚拢 */
  actE+=((act?1:0)-actE)*Math.min(1,dt*(act?2.1:0.8));
  const tg1=(mx>=0?clamp((mx-W/2-panX)*dist/FLv*1.0625,-425,425):0)*actE;
  const tg2=(mx>=0?clamp((H/2+panY-my)*dist/FLv*1.0625,-375,375):0)*actE;
  /* 反用 1€ Filter：光标速度越快，响应越缓，手���不忽���忽慢 */
  const inst=Math.hypot(mx-pmx,my-pmy)/Math.max(dt,0.001);pmx=mx;pmy=my;
  csS+=(inst-csS)*Math.min(1,dt*3);
  const rate=3.25/(1+csS/660)*damp;
  /* 非对称：追赶灵敏，松���后只用很小的力慢慢漂回——风停了纸飞机自己滑���航线 */
  const rEff=rate*(0.16+0.84*actE);
  g1+=(tg1-g1)*Math.min(1,dt*rEff);g2+=(tg2-g2)*Math.min(1,dt*rEff);
  window.__g=()=>[g1,g2,actE];
  /* 边界随镜头平滑推移，不突跳 */
  const cR0=Math.max(40,W*stC.capF-(W/2+panX)),cL0=Math.max(60,(W/2+panX)-W*0.05);
  capR+=(cR0-capR)*Math.min(1,dt*1.5);capL+=(cL0-capL)*Math.min(1,dt*1.5);
  stepBirds(t,dt);
  /* ���空锚在镜头实际看见的那片地面中心，而不是鸟群坐标：
     看到���地面还是雪，天空就还是雪境；镜头回望时天空也跟着回望方向。 */
  calcAmb(cam.x+f.x*FAR*0.45);
  document.documentElement.style.setProperty('--ink',amb.ui);
  const yhz=H/2+panY-FLv*Math.tan(A);
  horizonY=yhz;
  const horizonC=horizonGroundColor();
  const g=ctx.createLinearGradient(0,0,0,H);
  if(tilt>0.02&&yhz>-H){
    const hn=clamp(yhz/H,0.01,0.97);
    /* 最低天空 stop 直接接远方最终田块色；不改写任何近/中景地面。 */
    g.addColorStop(0,amb.sky[0]);g.addColorStop(Math.max(0.01,hn-0.11),amb.sky[1]);g.addColorStop(hn,horizonC);g.addColorStop(1,horizonC);
  }else{g.addColorStop(0,amb.flat[0]);g.addColorStop(1,amb.flat[1])}
  ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
  /* 前方�����：沿迁徙方向分别采样前/后天空；天亮会从前方地平线推过来 */
  const sf=styleMix(flockX+2100,Ly),sb=styleMix(flockX-2100,Ly);
  const fSky=styC('sky',0,sf[0],sf[1],sf[2]),bSky=styC('sky',0,sb[0],sb[1],sb[2]);
  const dawn=clamp((lumC(fSky)-lumC(bSky))/150,0,1);
  if(dawn>0.025){
    /* 世界前方 +x 投影到屏幕上：不同镜���下亮源仍在飞行前方 */
    const sx=W*0.5+r.x*W*0.62,sy=H*0.48-u.x*H*0.32;
    const fg=ctx.createRadialGradient(sx,sy,0,sx,sy,Math.max(W,H)*0.78);
    fg.addColorStop(0,rgbaC(fSky,0.68*dawn));fg.addColorStop(0.42,rgbaC(fSky,0.25*dawn));fg.addColorStop(1,rgbaC(fSky,0));
    ctx.fillStyle=fg;ctx.fillRect(0,0,W,H);
  }
  /* 后方不是��亮：它跟随当前场景底色慢慢追上，和地面暗色消失同节奏 */
  const rearSky=amb.sky[0],rearLift=clamp((lumC(rearSky)-lumC(bSky))/150,0,1);
  if(rearLift>0.02){
    const rx=W*0.5-r.x*W*0.54,ry=H*0.52+u.x*H*0.24;
    const rg=ctx.createRadialGradient(rx,ry,0,rx,ry,Math.max(W,H)*0.92);
    rg.addColorStop(0,rgbaC(rearSky,0.48*rearLift));rg.addColorStop(0.58,rgbaC(rearSky,0.16*rearLift));rg.addColorStop(1,rgbaC(rearSky,0));
    ctx.fillStyle=rg;ctx.fillRect(0,0,W,H);
  }
  /* 太阳只在跨入/离开夜航的晨昏弧段出现；它是可见光源，不是整片地面的���镜。 */
  sunLight=null;
  const solarArc=[sf[0],sf[1],sb[0],sb[1]].includes(4);
  const solarDelta=(lumC(fSky)-lumC(bSky))/150,solarP=solarArc?clamp(Math.abs(solarDelta)*1.35,0,1):0;
  if(solarP>0.055){
    /* 锚在迁徙世界的晨昏锋面，而不是以屏幕中心/镜头轴计算。 */
    const dir=solarDelta>=0?1:-1,boundary=Math.round(flockX/SEG)*SEG,wx=boundary+dir*SEG*0.28,wy=riverC(wx),wp=proj(wx,wy,180);
    if(wp&&wp.x>-W*0.28&&wp.x<W*1.28&&wp.y>-H*0.2&&wp.y<H*0.95){
      const sx=wp.x,sy=wp.y,sc=dir>0?'#ffe0ae':'#efb0ab',halo=ctx.createRadialGradient(sx,sy,0,sx,sy,H*(0.12+solarP*0.045));
      /* 这是贴在地平线的稀薄光云，不画太阳圆盘。 */
      halo.addColorStop(0,rgbaC(sc,0.075*solarP));halo.addColorStop(0.28,rgbaC(sc,0.035*solarP));halo.addColorStop(0.72,rgbaC(sc,0.008*solarP));halo.addColorStop(1,rgbaC(sc,0));ctx.fillStyle=halo;ctx.fillRect(0,0,W,H);
      sunLight={x:sx,y:sy,p:solarP,c:sc};
    }
  }
  drawNightStars(t);
  drawGround(t);
  drawSunGroundLight();
  drawFlowAtmosphere(t);
  drawShadows();
  drawObjects(t);
  /* 地��线雾带 */
  if(tilt>0.05&&yhz>-200&&yhz<H+200){
    const hz=ctx.createLinearGradient(0,yhz-80,0,yhz+110);
    hz.addColorStop(0,'rgba('+amb.fog+',0)');hz.addColorStop(0.5,'rgba('+amb.fog+','+amb.fogA.toFixed(3)+')');hz.addColorStop(1,'rgba('+amb.fog+',0)');
    ctx.fillStyle=hz;ctx.fillRect(0,yhz-80,W,190);
  }
  /* 左上过渡光 */
  const lg=ctx.createRadialGradient(W*0.06,H*0.04,0,W*0.06,H*0.04,Math.max(W,H)*0.85);
  lg.addColorStop(0,'rgba('+amb.glow+','+amb.glowA.toFixed(3)+')');lg.addColorStop(0.5,'rgba('+amb.glow+','+(amb.glowA*0.3).toFixed(3)+')');lg.addColorStop(1,'rgba('+amb.glow+',0)');
  ctx.fillStyle=lg;ctx.fillRect(0,0,W,H);
  const dg=ctx.createRadialGradient(W*0.94,H*0.96,0,W*0.94,H*0.96,Math.max(W,H)*0.9);
  dg.addColorStop(0,'rgba('+amb.corn+','+amb.cornA.toFixed(3)+')');dg.addColorStop(1,'rgba('+amb.corn+',0)');
  ctx.fillStyle=dg;ctx.fillRect(0,0,W,H);
  /* UI */
  let li=stC.k+1,lb=SHOTS[SCHED[stC.k].s].label;
  if(stC.mix>0.5){if(stC.k+1<SCHED.length){li=stC.k+2;lb=SHOTS[SCHED[stC.k+1].s].label}else{li=1;lb=SHOTS[SCHED[0].s].label}}
  const nn=v=>(v<10?'0':'')+v;
  idxEl.textContent=!started&&p<0.005?'00 · PRELUDE':nn(li)+' · '+lb+(loopN>0?' — VAR '+nn(loopN+1):'');
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
