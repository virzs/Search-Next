<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Clock Widget Dev</title>
    <style>
      :root { font-family: system-ui, -apple-system, Segoe UI, Roboto, Ubuntu, Cantarell, Noto Sans, Arial; }
      body { margin: 0; padding: 16px; background: #f7f7fb; }
      .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
      .card { background: #fff; border-radius: 12px; box-shadow: 0 8px 30px rgba(0,0,0,0.08); padding: 12px; }
      .title { font-weight: 600; font-size: 14px; color: #374151; margin-bottom: 8px; }
      .box { border: 1px dashed #d1d5db; border-radius: 12px; height: 180px; }
      .full { height: 360px; }
      .controls { margin-top: 16px; padding: 12px; background: #fff; border-radius: 12px; box-shadow: 0 8px 30px rgba(0,0,0,0.08); }
      .controls label { display: block; margin-bottom: 8px; font-size: 14px; color: #374151; }
      .controls select, .controls input { margin-left: 8px; padding: 4px 8px; border: 1px solid #d1d5db; border-radius: 6px; font-size: 13px; }
    </style>
  </head>
  <body>
    <h1 style="font-size: 16px;">Clock Widget 开发页面</h1>
    <p style="color:#6b7280;">此页面用于独立开发与调试小组件，使用本地依赖注入 React/ReactDOM。</p>
    <div class="grid">
      <div class="card">
        <div class="title">图标模式（icon）</div>
        <div id="icon" class="box"></div>
      </div>
      <div class="card">
        <div class="title">完整模式（full）</div>
        <div id="full" class="box full"></div>
      </div>
    </div>

    <div class="controls">
      <h3 style="margin: 0 0 12px; font-size: 14px;">设置面板（模拟 sdk.storage）</h3>
      <label>
        时区：
        <select id="tz-select">
          <option value="">本地时间</option>
          <option value="UTC">UTC</option>
          <option value="Asia/Shanghai">北京 (UTC+8)</option>
          <option value="Asia/Tokyo">东京 (UTC+9)</option>
          <option value="America/New_York">纽约 (UTC-5)</option>
          <option value="Europe/London">伦敦 (UTC+0)</option>
          <option value="America/Los_Angeles">洛杉矶 (UTC-8)</option>
        </select>
      </label>
      <label>
        标题：
        <input id="title-input" type="text" placeholder="时钟" />
      </label>
      <label>
        <input id="seconds-check" type="checkbox" checked /> 显示秒
      </label>
    </div>

    <script type="module">
      import React from 'react';
      import * as ReactDOMClient from 'react-dom/client';
      window.React = React;
      window.ReactDOM = ReactDOMClient;

      const storage = {};
      const eventListeners = {};

      const mockSdk = {
        widgetId: 'clock-dev',
        sizeId: '2x2',
        theme: { activeThemeId: 'light' },
        onThemeChange: () => () => {},
        storage: {
          get: (key) => Promise.resolve(storage[key] ?? null),
          set: (key, value) => {
            storage[key] = value;
            return Promise.resolve();
          },
        },
        events: {
          on: (event, handler) => {
            if (!eventListeners[event]) eventListeners[event] = [];
            eventListeners[event].push(handler);
            return () => {
              eventListeners[event] = eventListeners[event].filter(h => h !== handler);
            };
          },
          emit: (event, payload) => {
            (eventListeners[event] || []).forEach(h => h(payload));
          },
        },
      };

      const mod = await import('./src/index.jsx');
      mod.mount(document.getElementById('icon'), { mode: 'icon', title: '时钟 Dev', sdk: mockSdk });
      mod.mount(document.getElementById('full'), { mode: 'full', title: '时钟 Dev', sdk: mockSdk });

      document.getElementById('tz-select').addEventListener('change', (e) => {
        storage.timezone = e.target.value;
        mockSdk.events.emit('storage:changed', { key: 'timezone', value: e.target.value });
      });
      document.getElementById('title-input').addEventListener('input', (e) => {
        storage.title = e.target.value;
        mockSdk.events.emit('storage:changed', { key: 'title', value: e.target.value });
      });
      document.getElementById('seconds-check').addEventListener('change', (e) => {
        storage.showSeconds = e.target.checked;
        mockSdk.events.emit('storage:changed', { key: 'showSeconds', value: e.target.checked });
      });

      if (import.meta.hot) {
        import.meta.hot.dispose(() => {});
      }
    </script>
  </body>
</html>
